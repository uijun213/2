name: CoreBundle
version: '1.0.0'
main: com.yourserver.core.CorePlugin
api-version: '1.20'
author: YourServerAdmin
description: 하드코어 야생 서버 전용 통합 플러그인 (스폰 보호 / 스코어보드 / 낚시 / 커스텀 몹)
softdepend: [Vault]

commands:
  fish:
    description: 낚은 커스텀 물고기를 판매합니다
    usage: /fish sell
  coreadmin:
    description: CoreBundle 관리자 명령어 (스폰 보호구역 설정 등)
    usage: /coreadmin <setcenter|setradius|info|reload>
    permission: corebundle.admin
    permission-message: 권한이 없습니다.

permissions:
  corebundle.admin:
    description: CoreBundle 관리자 명령어 사용 권한
    default: op
  corebundle.bypass:
    description: 스폰 보호구역 제한을 무시함
    default: op
