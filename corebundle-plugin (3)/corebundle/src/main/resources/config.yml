# =========================================================
#  CoreBundle 설정 파일
# =========================================================

# ---------------------------------------------------------
# ① 스폰 보호 구역 설정
#    setcenter / setradius 명령어로도 런타임에 수정 가능하며,
#    수정 시 이 파일에 자동 저장됩니다.
# ---------------------------------------------------------
spawn-region:
  enabled: true
  world: world
  center-x: 0
  center-y: 64
  center-z: 0
  radius: 100          # 반경(블록). 이 안에서는 일반 유저의 파괴/설치/약탈 차단

# ---------------------------------------------------------
# ③ 스코어보드 / HUD 설정
# ---------------------------------------------------------
scoreboard:
  enabled: true
  update-interval-ticks: 20     # 20틱 = 1초
  server-name: "MyHardcoreServer"
  title: "&6&l서버 정보"
  tab-header: "&e&l========================"
  tab-footer: "&7접속을 환영합니다!"

# 좌표 / 방위 액션바 HUD (미니맵 대체 텍스트 표시, 하드코어 서버라면 false로 꺼도 됨)
coord-hud:
  enabled: true
  update-interval-ticks: 20

# ---------------------------------------------------------
# ⑤ 커스텀 낚시 설정
# ---------------------------------------------------------
fishing:
  enabled: true
  chance-common: 55      # %
  chance-rare: 30        # %
  chance-legendary: 15   # %
  price-common: 20
  price-rare: 80
  price-legendary: 300
  size-min-cm: 5
  size-max-cm: 120

# ---------------------------------------------------------
# ⑥ 커스텀 몬스터 설정
# ---------------------------------------------------------
custom-mobs:
  enabled: true
  night-only: true
  spawn-chance-percent: 8      # 자연 스폰 몹 중 강화 몹이 될 확률
  health-multiplier: 2.5
  damage-multiplier: 1.8
  reward-money: 150
  reward-exp: 40

# ---------------------------------------------------------
# 귀환석 (즉시 스폰 이동 아이템)
# ---------------------------------------------------------
recall-stone:
  cooldown-seconds: 10   # 재사용 대기시간(초). 플레이어별로 개별 적용됨
